<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 235" width="900" height="235" role="img" aria-label="Startup sequence: init stamps genesis with the current time and picks a free subnet; wave one starts the bootnode and node one; the control plane then reads node one's identity from its beacon API and writes it into the environment; only then does wave two start nodes two and three.">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EFEADF"/></marker>
    <marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F0813E"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="8" y="20" font-size="11.5" fill="#9B9285">A consensus client finds its peers from an ENR. Node 1's ENR does not exist until node 1 does.</text>

    <rect x="8" y="46" width="176" height="76" rx="6" fill="#1C1A17" stroke="#EFEADF" stroke-width="1.5"/>
    <text x="96" y="70" font-size="12.5" font-weight="600" text-anchor="middle" fill="#EFEADF" font-family="ui-monospace, monospace">network init</text>
    <text x="96" y="89" font-size="10.5" text-anchor="middle" fill="#9B9285">genesis stamped now</text>
    <text x="96" y="104" font-size="10.5" text-anchor="middle" fill="#9B9285">a free subnet chosen</text>
    <text x="96" y="119" font-size="10.5" text-anchor="middle" fill="#9B9285">64 validator keys</text>
    <line x1="184" y1="84" x2="222" y2="84" stroke="#EFEADF" stroke-width="1.5" marker-end="url(#s)"/>

    <rect x="222" y="46" width="176" height="76" rx="6" fill="#1C1A17" stroke="#EFEADF" stroke-width="1.5"/>
    <text x="310" y="70" font-size="12.5" font-weight="600" text-anchor="middle" fill="#EFEADF">wave one</text>
    <text x="310" y="89" font-size="10.5" text-anchor="middle" fill="#9B9285">bootnode</text>
    <text x="310" y="104" font-size="10.5" text-anchor="middle" fill="#9B9285">node 1 — geth, Lighthouse,</text>
    <text x="310" y="119" font-size="10.5" text-anchor="middle" fill="#9B9285">its validator client</text>
    <line x1="398" y1="84" x2="436" y2="84" stroke="#EFEADF" stroke-width="1.5" marker-end="url(#s)"/>

    <rect x="436" y="38" width="192" height="92" rx="6" fill="#24211D" stroke="#F0813E" stroke-width="2"/>
    <text x="532" y="62" font-size="12.5" font-weight="600" text-anchor="middle" fill="#F0813E">read the identity</text>
    <text x="532" y="81" font-size="10.5" text-anchor="middle" fill="#9B9285">poll node 1's beacon API</text>
    <text x="532" y="96" font-size="10.5" text-anchor="middle" fill="#9B9285">for its ENR and peer id</text>
    <text x="532" y="115" font-size="10" text-anchor="middle" fill="#F0813E" font-family="ui-monospace, monospace">→ network.env</text>
    <line x1="628" y1="84" x2="666" y2="84" stroke="#EFEADF" stroke-width="1.5" marker-end="url(#s)"/>

    <rect x="666" y="46" width="176" height="76" rx="6" fill="#1C1A17" stroke="#EFEADF" stroke-width="1.5"/>
    <text x="754" y="70" font-size="12.5" font-weight="600" text-anchor="middle" fill="#EFEADF">wave two</text>
    <text x="754" y="89" font-size="10.5" text-anchor="middle" fill="#9B9285">nodes 2 and 3 start</text>
    <text x="754" y="104" font-size="10.5" text-anchor="middle" fill="#9B9285">knowing where to find</text>
    <text x="754" y="119" font-size="10.5" text-anchor="middle" fill="#9B9285">node 1</text>

    <path d="M532 130 L532 162 Q532 172 542 172 L744 172 Q754 172 754 162 L754 128" fill="none" stroke="#F0813E" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sg)"/>
    <text x="643" y="192" font-size="11" text-anchor="middle" fill="#F0813E">a value one container produced, that another needs in order to start</text>
    <text x="643" y="211" font-size="10.5" text-anchor="middle" fill="#9B9285">no compose file can express this edge — which is most of the reason there is a control plane</text>
  </g>
</svg>
