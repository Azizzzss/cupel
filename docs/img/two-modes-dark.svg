<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-label="Lab mode has one geth node driven by a block producer on the host over the Engine API. Network mode has two geth nodes and a Reth node, each paired with a different consensus client, gossiping between themselves, with a bootnode for execution-layer discovery.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EFEADF"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F0813E"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A3BAC8"/></marker>
  </defs>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="14" y="22" font-size="13" font-weight="700" fill="#EFEADF">LAB MODE</text>
    <text x="512" y="22" font-size="13" font-weight="700" fill="#EFEADF">NETWORK MODE</text>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="14" y="40" font-size="11.5" fill="#9B9285">cupel up — eight seconds, one node</text>
    <text x="512" y="40" font-size="11.5" fill="#9B9285">cupel network up — nine containers</text>

    <line x1="486" y1="10" x2="486" y2="320" stroke="#332E27" stroke-width="1" stroke-dasharray="4 5"/>

    <!-- ============ lab ============ -->
    <rect x="150" y="60" width="210" height="32" rx="4" fill="none" stroke="#EFEADF" stroke-width="1.3"/>
    <text x="255" y="80" font-size="12" text-anchor="middle" fill="#EFEADF">cast · forge · MetaMask · viem</text>
    <line x1="255" y1="92" x2="255" y2="116" stroke="#EFEADF" stroke-width="1.3" marker-end="url(#a)"/>

    <rect x="150" y="116" width="210" height="42" rx="4" fill="#24211D" stroke="#EFEADF" stroke-width="1.6"/>
    <text x="255" y="134" font-size="12.5" font-weight="600" text-anchor="middle" fill="#EFEADF">gateway</text>
    <text x="255" y="149" font-size="11" text-anchor="middle" fill="#9B9285" font-family="ui-monospace, monospace">:8545</text>
    <line x1="255" y1="158" x2="255" y2="186" stroke="#EFEADF" stroke-width="1.3" marker-end="url(#a)"/>

    <rect x="150" y="186" width="210" height="46" rx="4" fill="none" stroke="#EFEADF" stroke-width="1.6"/>
    <text x="255" y="206" font-size="12.5" font-weight="600" text-anchor="middle" fill="#EFEADF">geth</text>
    <text x="255" y="222" font-size="11" text-anchor="middle" fill="#9B9285" font-family="ui-monospace, monospace">:8546 · one container</text>

    <rect x="18" y="186" width="110" height="46" rx="4" fill="none" stroke="#F0813E" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="73" y="205" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F0813E">producer</text>
    <text x="73" y="220" font-size="10.5" text-anchor="middle" fill="#F0813E">on the host</text>
    <line x1="128" y1="209" x2="148" y2="209" stroke="#F0813E" stroke-width="1.5" marker-end="url(#g)"/>
    <text x="73" y="252" font-size="10.5" text-anchor="middle" fill="#F0813E">Engine API — four</text>
    <text x="73" y="266" font-size="10.5" text-anchor="middle" fill="#F0813E">authenticated calls</text>
    <text x="73" y="280" font-size="10.5" text-anchor="middle" fill="#F0813E">per block</text>

    <text x="255" y="256" font-size="11" text-anchor="middle" fill="#9B9285">no consensus · no peers · no finality</text>
    <text x="255" y="272" font-size="11" text-anchor="middle" fill="#9B9285">nothing to sync, nothing to store</text>

    <!-- ============ network ============ -->
    <rect x="620" y="60" width="230" height="28" rx="4" fill="none" stroke="#EFEADF" stroke-width="1.3"/>
    <text x="735" y="78" font-size="12" text-anchor="middle" fill="#EFEADF">the same clients, the same code</text>
    <line x1="735" y1="88" x2="735" y2="104" stroke="#EFEADF" stroke-width="1.3" marker-end="url(#a)"/>

    <rect x="620" y="104" width="230" height="34" rx="4" fill="#24211D" stroke="#EFEADF" stroke-width="1.6"/>
    <text x="735" y="120" font-size="12.5" font-weight="600" text-anchor="middle" fill="#EFEADF">gateway</text>
    <text x="735" y="133" font-size="10.5" text-anchor="middle" fill="#9B9285" font-family="ui-monospace, monospace">:8545 — three upstreams</text>

    <path d="M735 138 L735 150 L575 150 L575 162" fill="none" stroke="#EFEADF" stroke-width="1.2" marker-end="url(#a)"/>
    <path d="M735 138 L735 162" fill="none" stroke="#EFEADF" stroke-width="1.2" marker-end="url(#a)"/>
    <path d="M735 138 L735 150 L895 150 L895 162" fill="none" stroke="#EFEADF" stroke-width="1.2" marker-end="url(#a)"/>

    <g font-size="11.5" text-anchor="middle" fill="#EFEADF">
      <rect x="529" y="162" width="92" height="28" rx="4" fill="none" stroke="#EFEADF" stroke-width="1.4"/><text x="575" y="180">geth</text>
      <rect x="689" y="162" width="92" height="28" rx="4" fill="none" stroke="#EFEADF" stroke-width="1.4"/><text x="735" y="180">geth</text>
      <rect x="849" y="162" width="92" height="28" rx="4" fill="none" stroke="#EFEADF" stroke-width="1.4"/><text x="895" y="180">Reth</text>
    </g>

    <g stroke="#F0813E" stroke-width="1.3">
      <line x1="575" y1="190" x2="575" y2="212" marker-end="url(#g)"/>
      <line x1="735" y1="190" x2="735" y2="212" marker-end="url(#g)"/>
      <line x1="895" y1="190" x2="895" y2="212" marker-end="url(#g)"/>
    </g>
    <text x="660" y="205" font-size="10" text-anchor="middle" fill="#F0813E">Engine API</text>

    <g font-size="11.5" text-anchor="middle">
      <rect x="529" y="212" width="92" height="34" rx="4" fill="#24211D" stroke="#A3BAC8" stroke-width="1.6"/>
      <text x="575" y="227" font-weight="600" fill="#EFEADF">Lighthouse</text><text x="575" y="240" font-size="10" fill="#9B9285">22 validators</text>
      <rect x="689" y="212" width="92" height="34" rx="4" fill="#24211D" stroke="#A3BAC8" stroke-width="1.6"/>
      <text x="735" y="227" font-weight="600" fill="#EFEADF">Prysm</text><text x="735" y="240" font-size="10" fill="#9B9285">21 validators</text>
      <rect x="849" y="212" width="92" height="34" rx="4" fill="#24211D" stroke="#A3BAC8" stroke-width="1.6"/>
      <text x="895" y="227" font-weight="600" fill="#EFEADF">Teku</text><text x="895" y="240" font-size="10" fill="#9B9285">21 validators</text>
    </g>

    <g stroke="#A3BAC8" stroke-width="1.4">
      <line x1="575" y1="246" x2="575" y2="260"/><line x1="735" y1="246" x2="735" y2="260"/><line x1="895" y1="246" x2="895" y2="260"/>
      <path d="M621 260 L689 260" fill="none" marker-end="url(#b)" marker-start="url(#b)"/>
      <path d="M781 260 L849 260" fill="none" marker-end="url(#b)" marker-start="url(#b)"/>
    </g>
    <text x="735" y="277" font-size="10.5" text-anchor="middle" fill="#A3BAC8">blocks and attestations, over gossip</text>

    <rect x="655" y="288" width="160" height="20" rx="10" fill="none" stroke="#7C7469" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="735" y="302" font-size="10" text-anchor="middle" fill="#9B9285">bootnode — the three find each other</text>
  </g>
</svg>
