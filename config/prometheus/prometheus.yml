# Two things are worth scraping in lab mode. The gateway says what clients
# actually experienced, which is not the same as what the node thinks of itself;
# the node says why — a transaction the gateway saw accepted can still be sitting
# in the pool because it pays under the miner's floor, and only geth's own
# counters admit it.
#
# In network mode the node's view is the whole point. Three execution clients and
# three different consensus clients should agree about the head, and a scrape of
# each one is how that is checked rather than asserted.
#
# Every target for a mode that is not running reports down, and Prometheus says
# so rather than hiding it. That is the honest answer, and the dashboards are
# written to expect it.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: cupel-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8545"]
        labels:
          instance: gateway

  - job_name: cupel-execution
    # geth does not serve Prometheus at /metrics. It serves expvar there and
    # the text exposition format here, and pointing at the wrong one produces a
    # target that answers, scrapes clean, and yields nothing.
    metrics_path: /debug/metrics/prometheus
    static_configs:
      # Lab mode's single node, in the same job as the devnet's three so one
      # dashboard serves both modes and only the label says which is which.
      - targets: ["host.docker.internal:6060"]
        labels: { node: lab, client: geth }
      - targets: ["host.docker.internal:6061"]
        labels: { node: node1, client: geth }
      - targets: ["host.docker.internal:6062"]
        labels: { node: node2, client: geth }
      - targets: ["host.docker.internal:6063"]
        labels: { node: node3, client: geth }

  - job_name: cupel-consensus
    static_configs:
      - targets: ["host.docker.internal:6071"]
        labels: { node: node1, client: lighthouse }
      - targets: ["host.docker.internal:6072"]
        labels: { node: node2, client: prysm }
      - targets: ["host.docker.internal:6073"]
        labels: { node: node3, client: teku }
