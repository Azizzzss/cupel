# What to scrape, and from where.
#
# The clients are scraped by container name over the Docker network Cupel
# created, not through the host. Their ports are published on 127.0.0.1 for a
# person to curl, and a container reaching `host.docker.internal` arrives on the
# bridge address instead — where nothing is listening. Docker Desktop's port
# proxy hides that; on plain Linux Docker every scrape was refused and every
# panel drew an empty box. Going directly over the network is both correct and
# one hop shorter.
#
# `cupel observe` attaches this container to whichever Cupel networks exist, so
# the targets for the mode that is not running simply resolve to nothing and
# report as down — which is the honest answer.
#
# In lab mode the gateway is the only thing worth scraping: what matters is what
# clients experienced, not what the node thinks of itself. In network mode the
# node's own view is the point — three execution clients and three different
# consensus clients should agree about the head, and a scrape of each is how
# that is checked rather than asserted.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # The gateway runs on the host, not in a container, so this one does have to
  # reach back out. It is the only target that does, and the only one that needs
  # `cupel up --bind 0.0.0.0` to be scrapeable on plain Linux Docker.
  - job_name: cupel-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8545"]
        labels:
          instance: gateway

  - job_name: cupel-execution
    # geth does not serve Prometheus at /metrics. It serves expvar there and
    # the text exposition format here, and pointing at the wrong one produces a
    # target that answers, scrapes clean, and yields nothing.
    metrics_path: /debug/metrics/prometheus
    static_configs:
      - targets: ["cupel-geth:6060"]
        labels: { node: lab, client: geth }
      - targets: ["cupel-el1:6060"]
        labels: { node: node1, client: geth }
      - targets: ["cupel-el2:6060"]
        labels: { node: node2, client: geth }
      # Reth serves the exposition format at the root, and a label beginning
      # with two underscores overrides the job's path for this target alone.
      # Same job, so "every execution client is up" still counts three. Its
      # metrics are named reth_*, so the geth panels on the execution
      # dashboard draw nodes 1 and 2 and leave this one out rather than guess.
      - targets: ["cupel-el3:6060"]
        labels: { node: node3, client: reth, __metrics_path__: / }

  # Each consensus client publishes on its own port, because none of the three
  # agreed on a default.
  - job_name: cupel-consensus
    static_configs:
      - targets: ["cupel-cl1:5054"]
        labels: { node: node1, client: lighthouse }
      - targets: ["cupel-cl2:8080"]
        labels: { node: node2, client: prysm }
      - targets: ["cupel-cl3:8008"]
        labels: { node: node3, client: teku }
