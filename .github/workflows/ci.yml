name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: The committed diagrams match their generator
        # Same reasoning as the genesis check: a diagram edited by hand and not
        # regenerated is a picture of a system that no longer exists, and there
        # is no way to notice by reading either file.
        run: |
          python3 docs/make-diagrams.py
          git diff --exit-code docs/img/

      - name: Every image the README shows is in the repository
        # A renamed screenshot does not fail anything: GitHub draws a broken
        # image and a line of alt text, which on the front page of the project
        # is the first thing anybody sees.
        run: |
          set -e
          paths=$(grep -oE '(src|srcset)="docs/img/[^"]+"' README.md | cut -d'"' -f2 | sort -u)
          test -n "$paths"
          for path in $paths; do
            test -f "$path" || { echo "README shows $path, which does not exist"; exit 1; }
            echo "ok  $path"
          done

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Formatting
        run: forge fmt --check
        working-directory: contracts

      - name: Tests
        run: forge test -vv
        working-directory: contracts

      - name: The committed genesis matches the compiled contracts
        # A contract changed without regenerating genesis would ship a chain
        # running last week's bytecode, silently. Rebuilding and regenerating
        # here must produce no diff.
        run: |
          forge build --root contracts
          cargo run -q -p cupel -- genesis
          git diff --exit-code config/genesis/genesis.json

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Dependencies
        run: npm ci
        working-directory: ui

      - name: Lints
        run: npx oxlint src
        working-directory: ui

      - name: Types
        # `tsc --noEmit` here type-checked nothing at all. ui/tsconfig.json is a
        # solution file — "files": [] and two references — so plain tsc obeyed
        # it exactly, checked zero files and exited 0. Adding a deliberate type
        # error changed nothing. Build mode follows the references.
        run: npx tsc -b --noEmit
        working-directory: ui

      - name: Tests
        # The page's arithmetic: which verdict three clients earn, where the
        # wall clock is in slots and epochs, how a hex word becomes a name or a
        # balance. All of it pure, none of it needing a browser.
        run: npm test
        working-directory: ui

      - name: The committed bundle matches its source
        # `ui/dist` is a build output kept in the repository, because it is
        # compiled into the binary with rust-embed. That is what lets `cargo
        # build` and all four release targets produce a working control room
        # with no JavaScript toolchain anywhere near them — the same trade the
        # contracts make by committing bytecode into genesis.
        #
        # The price of that trade is paid here. Rebuild from source; fail if the
        # result differs from what is committed. Without this step a release
        # ships whichever bundle someone last built by hand, and a change to the
        # TypeScript that nobody rebuilt is invisible: the tests pass, the
        # binary links, and the page is last week's.
        #
        # Staged rather than plain `git diff`, so a renamed asset — the file
        # names carry a content hash, so any real change renames them — counts
        # as a difference instead of arriving as an untracked file nobody looks
        # at.
        run: |
          npm ci
          npm run build
          cd ..
          git add --intent-to-add ui/dist
          git diff --exit-code -- ui/dist
        working-directory: ui

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: cargo build -p cupel

      - name: Bring up a chain and use it
        # The real check: not that the code compiles, but that a chain comes up,
        # produces blocks, carries the contracts, and answers a client.
        run: |
          # --bind 0.0.0.0 so Prometheus can scrape the gateway. It binds
          # localhost by default and a container reaching host.docker.internal
          # arrives on the bridge address, where nothing would be listening.
          ./target/debug/cupel up --bind 0.0.0.0 > cupel.log 2>&1 &
          for _ in $(seq 1 90); do
            grep -q "Producing blocks" cupel.log && break
            sleep 1
          done
          grep -q "Producing blocks" cupel.log || { cat cupel.log; exit 1; }

          RPC=http://127.0.0.1:8545
          TOKEN=0x00000000000000000000000000000000c0de0020
          KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
          ME=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266

          test "$(cast chain-id --rpc-url $RPC)" = "31337"
          test "$(cast call $TOKEN 'name()(string)' --rpc-url $RPC)" = '"Cupel Token"'

          # Blocks must actually advance, not merely exist.
          before=$(cast block-number --rpc-url $RPC)
          sleep 4
          after=$(cast block-number --rpc-url $RPC)
          test "$after" -gt "$before"

          # A write, end to end.
          cast send $TOKEN 'mint(address,uint256)' $ME 1000000000000000000000 \
            --rpc-url $RPC --private-key $KEY >/dev/null
          test "$(cast call $TOKEN 'balanceOf(address)(uint256)' $ME --rpc-url $RPC)" \
            = "1000000000000000000000 [1e21]"

          # The signer refuses what the policy forbids.
          curl -s -X POST http://127.0.0.1:8550 -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"eth_signTransaction","params":[{"from":"0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC","to":"0x0000000000000000000000000000000000000042","value":"0x56bc75e2d63100000","gas":"0x5208","nonce":"0x0"}]}' \
            | grep -q "refused by policy"

          echo "integration checks passed"

      - name: Traffic lands, all of it
        # `cupel traffic --clean` exits non-zero if any transaction reverts or
        # is accepted and never included. Either means the calldata, the
        # approval, a gas limit or the fee is wrong — and the ordinary run
        # reverts on purpose, so only the clean one can say so.
        run: |
          ./target/debug/cupel traffic --clean --duration 20 --burst 8 | tee traffic.log
          sent=$(grep -oE '^  [0-9]+ sent' traffic.log | grep -oE '[0-9]+')
          echo "sent $sent"
          test "$sent" -ge 20
          # And the blocks carry it: gas that varies, not one flat line. Asked
          # over plain JSON-RPC, because cast's flags for picking one field of
          # a block have changed between releases and this broke on them once.
          head=$(cast block-number --rpc-url http://127.0.0.1:8545)
          distinct=$(for n in $(seq $((head - 30)) "$head"); do
            curl -s -X POST http://127.0.0.1:8545 -H 'content-type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBlockByNumber\",\"params\":[\"$(printf '0x%x' "$n")\",false]}" \
              | jq -r '.result.gasUsed'
          done | sort -u | wc -l)
          echo "$distinct distinct gasUsed values in the last 31 blocks"
          test "$distinct" -ge 5

      - name: The walkthroughs run, and reach their conclusions
        # They are the part of this project a newcomer meets first, and until
        # this step nothing ran them. Each is checked for the sentence it exists
        # to arrive at, not only for exiting cleanly: a walkthrough that prints
        # the wrong verdict still exits 0.
        run: |
          set -eo pipefail
          ./target/debug/cupel lab 1 | tee lab1.log
          grep -q "Four calls, one block" lab1.log
          grep -q "VALID" lab1.log
          ./target/debug/cupel lab 2 | tee lab2.log
          grep -q "Accepted, pending, included" lab2.log
          # And the devnet ones refuse here, naming the command that starts
          # what they need, rather than failing somewhere inside the plumbing.
          if ./target/debug/cupel lab 3 > lab3.log 2>&1; then
            echo "walkthrough 3 ran against the lab chain"; exit 1
          fi
          cat lab3.log
          grep -q "cupel network up" lab3.log

      - name: Every dashboard panel resolves
        # A dashboard cannot fail loudly: rename a metric and the panel does not
        # error, it draws an empty box that looks like a quiet chain. So the
        # queries are asked of a real Prometheus scraping a real node, which is
        # the only way this stays true as geth moves.
        run: |
          ./target/debug/cupel observe
          # Wait for the targets to be *up*, not merely known. `up` appears as
          # soon as Prometheus has attempted a scrape and is 0 when the target
          # refused, so waiting for the series is waiting for the first failure.
          for _ in $(seq 1 60); do
            gw=$(curl -sfG http://127.0.0.1:9090/api/v1/query \
                  --data-urlencode 'query=up{job="cupel-gateway"}==1' | jq -r '.data.result|length')
            el=$(curl -sfG http://127.0.0.1:9090/api/v1/query \
                  --data-urlencode 'query=up{job="cupel-execution"}==1' | jq -r '.data.result|length')
            echo "targets up — gateway:${gw:-0} execution:${el:-0}"
            [ "${gw:-0}" -ge 1 ] && [ "${el:-0}" -ge 1 ] && break
            sleep 2
          done
          # Per-method counters only exist once a request has been through the
          # gateway, and block production talks to the node directly — so
          # without this the traffic panel is empty for a reason that has
          # nothing to do with the dashboard. Ask for something cheap.
          for _ in $(seq 1 5); do
            curl -s -X POST http://127.0.0.1:8545 -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' >/dev/null
          done
          # Two scrape intervals, so rate() and sum_over_time() have a window.
          sleep 12
          .github/scripts/check-dashboards.sh http://127.0.0.1:9090 lab

      - name: A chain starts from a download, with no checkout in reach
        # Everything above runs the binary from the working tree, where
        # `compose/lab.yml` is always a directory or two up. That is exactly how
        # a download that could not start a chain shipped for four releases: the
        # release archive holds a binary, the binary went looking for a checkout
        # that was not there, and no check in this repository ever stood
        # anywhere else.
        #
        # So this starts a chain the way a download does. The binary is copied
        # out, the working directory has no checkout above it, and the files
        # come from the binary itself. It is also the check that the mounts
        # inside the carried compose file resolve against the directory it was
        # written to rather than against wherever somebody happened to be.
        run: |
          set -eu
          # The chain from the first step is still running. `cupel down` stops
          # the container; the thing holding 8545 is the process that was
          # started in the background up there, and the bind error this step hit
          # says so in as many words: "cupel down and cupel network down stop
          # containers, not a process holding a port". Interrupt it the way a
          # person would, and give it a moment to put its container away.
          pkill -INT -x cupel || true
          sleep 3
          pkill -x cupel || true

          ./target/debug/cupel observe --down || true
          ./target/debug/cupel down

          cp target/debug/cupel "$RUNNER_TEMP/cupel"
          cd "$RUNNER_TEMP"
          export CUPEL_HOME="$RUNNER_TEMP/home"

          ./cupel up > from-home.log 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            grep -q "Producing blocks" from-home.log && break
            sleep 1
          done
          grep -q "Producing blocks" from-home.log || { cat from-home.log; exit 1; }

          test "$(cast call 0x00000000000000000000000000000000c0de0020 'name()(string)' \
            --rpc-url http://127.0.0.1:8545)" = '"Cupel Token"'
          test -f "$CUPEL_HOME/compose/lab.yml"
          test -f "$CUPEL_HOME/config/genesis/jwt.hex"

          kill -INT "$pid"
          wait "$pid" || true
          echo "a chain ran from $CUPEL_HOME, with no checkout in reach"

      - name: Logs on failure
        if: failure()
        run: |
          cat cupel.log || true
          cat "$RUNNER_TEMP/from-home.log" || true
          docker logs cupel-geth 2>&1 | tail -50 || true
          curl -s http://127.0.0.1:9090/api/v1/targets | head -c 2000 || true

      - name: Tear down
        if: always()
        run: |
          ./target/debug/cupel observe --down || true
          ./target/debug/cupel down || true
  network:
    name: network
    # Nine containers, four images to pull and several minutes to the first
    # finalised epoch. Too heavy for every pull request, and the only way to
    # know that three consensus clients still agree after a dependency moves.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: cargo build -p cupel

      - name: Pull the client images first
        # Genesis is stamped the moment `network up` generates it, and the
        # beacon chain starts thirty seconds later whether or not the clients
        # are running. Pulling four images afterwards would burn the first
        # epochs with a third of the validators offline, and epochs with less
        # than two thirds voting do not justify — so the chain would take twice
        # as long to finalise, or not finalise inside the timeout at all.
        run: |
          for image in ethpandaops/ethereum-genesis-generator:6.2.1 \
                       ethereum/client-go:stable \
                       ethereum/client-go:alltools-stable \
                       ghcr.io/paradigmxyz/reth:latest \
                       sigp/lighthouse:latest \
                       gcr.io/offchainlabs/prysm/beacon-chain:latest \
                       gcr.io/offchainlabs/prysm/validator:latest \
                       consensys/teku:latest \
                       alpine; do
            docker pull -q "$image"
          done

      - name: Bring up the devnet
        run: ./target/debug/cupel network up --detach

      - name: The clients run the slot time we asked for
        # This is the check that would have caught the bug on the day it was
        # introduced. `SECONDS_PER_SLOT` is not a value the genesis generator
        # templates, so asking it for six did nothing: the key was absent from
        # the config, all three clients used the mainnet preset's twelve, and
        # the chain ran correctly at half the intended rate for two releases.
        # Nothing failed. The only symptom was finality arriving twice as late
        # as every comment and banner promised.
        #
        # Writing the key in by hand is not a fix either — Lighthouse validates
        # the config against its compiled-in preset and refuses to start with
        # "YAML configuration incompatible with spec constants for mainnet".
        #
        # So twelve is the real number, and this asks the running chain rather
        # than reading the file, because what matters is what the clients use.
        run: |
          set -eo pipefail
          # All three, not just Lighthouse. They read the same config file, but
          # that is the assumption worth checking rather than the one to build
          # on: a client that fell back to its own preset would be running a
          # different chain and would answer this question differently.
          #
          # `network up --detach` returns when node1 answers; nodes 2 and 3
          # follow seconds later. The first time this asked all three, Prysm's
          # HTTP server was starting in the same second the request arrived and
          # the connection was reset. So each client gets two minutes to answer
          # at all before its answer is judged — the question is what it runs,
          # not how fast it boots.
          for port in 5052 5152 5252; do
            spec=""
            for _ in $(seq 1 24); do
              spec=$(curl -sf "http://127.0.0.1:$port/eth/v1/config/spec" || true)
              [ -n "$spec" ] && break
              sleep 5
            done
            if [ -z "$spec" ]; then
              echo "port $port never answered /eth/v1/config/spec"
              exit 1
            fi
            slot=$(printf '%s' "$spec" | jq -r '.data.SECONDS_PER_SLOT')
            epoch=$(printf '%s' "$spec" | jq -r '.data.SLOTS_PER_EPOCH')
            echo "port $port: ${slot}s slots, ${epoch} slots to an epoch"
            test "$slot" = "12"
            test "$epoch" = "32"
          done

      - name: The chain finalises
        # Finality is the whole claim of this mode. More than two thirds of the
        # stake must agree, and the stake is split 22/21/21 so that no single
        # node holds it — a finalised epoch is three independent implementations
        # agreeing, not one asserting.
        #
        # Four epochs of 32 twelve-second slots is about twenty-five minutes,
        # and a loaded runner misses some slots, so the window is forty-five.
        #
        # A previous version of this comment explained the same delay as "a
        # starved runner missing slots" and was wrong. The observation behind it
        # was right — blocks were arriving every twelve seconds rather than
        # every six — but the cause was the configuration above, not the runner.
        # The step now prints the head slot beside the slot the clock expects,
        # computed from the slot time the chain reports rather than from one
        # assumed here, so the number cannot quietly mean something else again.
        run: |
          genesis=$(curl -sf http://127.0.0.1:5052/eth/v1/beacon/genesis \
            | jq -r '.data.genesis_time // 0' 2>/dev/null || echo 0)
          case "$genesis" in ''|*[!0-9]*) genesis=0 ;; esac

          per_slot=$(curl -sf http://127.0.0.1:5052/eth/v1/config/spec \
            | jq -r '.data.SECONDS_PER_SLOT // 12' 2>/dev/null || echo 12)
          case "$per_slot" in ''|*[!0-9]*|0) per_slot=12 ;; esac

          for _ in $(seq 1 270); do
            # A failed request yields an empty string, and an empty string is
            # not "0" — testing for inequality would report a chain that never
            # answered as a chain that finalised. Insist on a positive integer.
            checkpoints=$(curl -sf http://127.0.0.1:5052/eth/v1/beacon/states/head/finality_checkpoints || echo '{}')
            epoch=$(printf '%s' "$checkpoints" | jq -r '.data.finalized.epoch // 0' 2>/dev/null || echo 0)
            just=$(printf '%s' "$checkpoints" | jq -r '.data.current_justified.epoch // 0' 2>/dev/null || echo 0)
            case "$epoch" in ''|*[!0-9]*) epoch=0 ;; esac
            case "$just" in ''|*[!0-9]*) just=0 ;; esac

            slot=$(curl -sf http://127.0.0.1:5052/eth/v1/beacon/headers/head \
              | jq -r '.data.header.message.slot // 0' 2>/dev/null || echo 0)
            case "$slot" in ''|*[!0-9]*) slot=0 ;; esac

            if [ "$genesis" -gt 0 ]; then
              want=$(( ( $(date +%s) - genesis ) / per_slot ))
              echo "slot $slot of an expected $want   justified $just   finalized $epoch"
            else
              echo "slot $slot   justified $just   finalized $epoch"
            fi

            if [ "$epoch" -gt 0 ]; then exit 0; fi
            sleep 10
          done

          echo
          echo "no finalised epoch after forty-five minutes"
          if [ "$genesis" -gt 0 ]; then
            want=$(( ( $(date +%s) - genesis ) / per_slot ))
            echo "the chain reached slot $slot where the clock expected $want,"
            echo "at ${per_slot}s to a slot. Close to the expected slot means the"
            echo "chain kept time and consensus did not converge; well short of"
            echo "it means slots were missed, which on a runner this size is"
            echo "load rather than disagreement."
          fi
          exit 1

      - name: All three clients agree
        # Three independent implementations, one chain. A disagreement here is
        # the most interesting failure this repository can produce.
        run: |
          set -e
          for port in 5052 5152 5252; do
            curl -sf "http://127.0.0.1:$port/eth/v1/beacon/headers/finalized" \
              | jq -r '.data.root' >> roots.txt
          done
          cat roots.txt
          test "$(sort -u roots.txt | wc -l)" -eq 1

      - name: The walkthroughs agree with the chain
        # Run after finality, so walkthrough 4 has something to compare. The
        # execution side can trail the beacon side by a moment, which the
        # walkthrough rightly calls "finalising now" — so it gets a few tries
        # to reach the verdict, and fails only if it never does.
        run: |
          set -o pipefail
          ./target/debug/cupel lab 3 | tee lab3.log
          grep -q "Finalised epoch" lab3.log
          for attempt in 1 2 3 4 5 6; do
            ./target/debug/cupel lab 4 | tee lab4.log
            if grep -q "one root, three clients — they agree" lab4.log \
               && grep -q "one block, from two implementations of the execution layer" lab4.log; then
              exit 0
            fi
            sleep 15
          done
          echo "walkthrough 4 never reached agreement"
          exit 1

      - name: The devnet carries the same contracts as the lab
        run: |
          set -e
          for port in 8555 8556 8557; do
            RPC="http://127.0.0.1:$port"
            test "$(cast chain-id --rpc-url $RPC)" = "31337"
            test "$(cast call 0x00000000000000000000000000000000c0de0020 'name()(string)' --rpc-url $RPC)" \
              = '"Cupel Token"'
          done

      - name: A transaction reaches a beacon-chain proposer
        run: |
          set -e
          RPC=http://127.0.0.1:8555
          KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
          ME=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
          cast send 0x00000000000000000000000000000000c0de0020 'mint(address,uint256)' $ME 1000000000000000000000 \
            --rpc-url $RPC --private-key $KEY --timeout 120 >/dev/null
          test "$(cast call 0x00000000000000000000000000000000c0de0020 'balanceOf(address)(uint256)' $ME --rpc-url $RPC)" \
            = "1000000000000000000000 [1e21]"

      - name: The execution clients find each other
        # Blocks travel over the consensus network, so three execution clients
        # that never peer still agree about every block — and the devnet did
        # exactly that for five releases, because the bootnode had joined
        # mainnet's discovery network and handed out mainnet nodes. Transactions
        # are what the execution network carries, so ask it directly: every
        # node should see the other two.
        run: |
          for _ in $(seq 1 24); do
            ok=1; line=""
            for port in 8555 8556 8557; do
              peers=$(curl -s -X POST "http://127.0.0.1:$port" -H 'content-type: application/json' \
                -d '{"jsonrpc":"2.0","id":1,"method":"net_peerCount","params":[]}' | jq -r '.result // "0x0"')
              line="$line $port=$((peers))"
              [ "$((peers))" -ge 2 ] || ok=0
            done
            echo "execution peers:$line"
            [ "$ok" = 1 ] && exit 0
            sleep 5
          done
          echo "the execution clients never formed a mesh"
          docker logs cupel-bootnode 2>&1 | tail -20
          exit 1

      - name: Traffic lands on the devnet too
        # Sent to node1 and gossiped: the proposer of any given slot may be
        # any of the three, so everything included went through devp2p first.
        run: ./target/debug/cupel traffic --clean --rpc http://127.0.0.1:8555 --duration 60

      - name: Every dashboard panel resolves
        # Same check as the lab job, against the mode that has consensus clients:
        # between the two, every panel on every dashboard is proven to resolve in
        # at least one mode, and the skip-lists say which mode that is.
        run: |
          ./target/debug/cupel observe
          for _ in $(seq 1 60); do
            cl=$(curl -sfG http://127.0.0.1:9090/api/v1/query \
                  --data-urlencode 'query=up{job="cupel-consensus"}==1' | jq -r '.data.result|length')
            el=$(curl -sfG http://127.0.0.1:9090/api/v1/query \
                  --data-urlencode 'query=up{job="cupel-execution"}==1' | jq -r '.data.result|length')
            echo "targets up — consensus:${cl:-0} execution:${el:-0}"
            [ "${cl:-0}" -ge 3 ] && [ "${el:-0}" -ge 3 ] && break
            sleep 2
          done
          sleep 12
          .github/scripts/check-dashboards.sh http://127.0.0.1:9090 network

      - name: Logs on failure
        if: failure()
        run: |
          for c in el1 cl1 vc1 el2 cl2 vc2 el3 cl3 bootnode; do
            echo "===== cupel-$c ====="
            docker logs "cupel-$c" 2>&1 | tail -40 || true
          done
          curl -s http://127.0.0.1:9090/api/v1/targets | head -c 2000 || true

      - name: Tear down
        if: always()
        run: |
          ./target/debug/cupel observe --down || true
          ./target/debug/cupel network reset || true
