name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: The committed diagrams match their generator
        # Same reasoning as the genesis check: a diagram edited by hand and not
        # regenerated is a picture of a system that no longer exists, and there
        # is no way to notice by reading either file.
        run: |
          python3 docs/make-diagrams.py
          git diff --exit-code docs/img/

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Formatting
        run: forge fmt --check
        working-directory: contracts

      - name: Tests
        run: forge test -vv
        working-directory: contracts

      - name: The committed genesis matches the compiled contracts
        # A contract changed without regenerating genesis would ship a chain
        # running last week's bytecode, silently. Rebuilding and regenerating
        # here must produce no diff.
        run: |
          forge build --root contracts
          cargo run -q -p cupel -- genesis
          git diff --exit-code config/genesis/genesis.json

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: cargo build -p cupel

      - name: Bring up a chain and use it
        # The real check: not that the code compiles, but that a chain comes up,
        # produces blocks, carries the contracts, and answers a client.
        run: |
          ./target/debug/cupel up > cupel.log 2>&1 &
          for _ in $(seq 1 90); do
            grep -q "Producing blocks" cupel.log && break
            sleep 1
          done
          grep -q "Producing blocks" cupel.log || { cat cupel.log; exit 1; }

          RPC=http://127.0.0.1:8545
          TOKEN=0x00000000000000000000000000000000c0de0020
          KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
          ME=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266

          test "$(cast chain-id --rpc-url $RPC)" = "31337"
          test "$(cast call $TOKEN 'name()(string)' --rpc-url $RPC)" = '"Cupel Token"'

          # Blocks must actually advance, not merely exist.
          before=$(cast block-number --rpc-url $RPC)
          sleep 4
          after=$(cast block-number --rpc-url $RPC)
          test "$after" -gt "$before"

          # A write, end to end.
          cast send $TOKEN 'mint(address,uint256)' $ME 1000000000000000000000 \
            --rpc-url $RPC --private-key $KEY >/dev/null
          test "$(cast call $TOKEN 'balanceOf(address)(uint256)' $ME --rpc-url $RPC)" \
            = "1000000000000000000000 [1e21]"

          # The signer refuses what the policy forbids.
          curl -s -X POST http://127.0.0.1:8550 -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"eth_signTransaction","params":[{"from":"0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC","to":"0x0000000000000000000000000000000000000042","value":"0x56bc75e2d63100000","gas":"0x5208"}]}' \
            | grep -q "refused by policy"

          echo "integration checks passed"

      - name: Every dashboard panel resolves
        # A dashboard cannot fail loudly: rename a metric and the panel does not
        # error, it draws an empty box that looks like a quiet chain. So the
        # queries are asked of a real Prometheus scraping a real node, which is
        # the only way this stays true as geth moves.
        run: |
          ./target/debug/cupel observe
          # Wait for the targets to be *up*, not merely known. `up` appears as
          # soon as Prometheus has attempted a scrape and is 0 when the target
          # refused, so waiting for the series is waiting for the first failure.
          for _ in $(seq 1 60); do
            gw=$(curl -sfG http://127.0.0.1:9090/api/v1/query \
                  --data-urlencode 'query=up{job="cupel-gateway"}==1' | jq -r '.data.result|length')
            el=$(curl -sfG http://127.0.0.1:9090/api/v1/query \
                  --data-urlencode 'query=up{job="cupel-execution"}==1' | jq -r '.data.result|length')
            echo "targets up — gateway:${gw:-0} execution:${el:-0}"
            [ "${gw:-0}" -ge 1 ] && [ "${el:-0}" -ge 1 ] && break
            sleep 2
          done
          # Per-method counters only exist once a request has been through the
          # gateway, and block production talks to the node directly — so
          # without this the traffic panel is empty for a reason that has
          # nothing to do with the dashboard. Ask for something cheap.
          for _ in $(seq 1 5); do
            curl -s -X POST http://127.0.0.1:8545 -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' >/dev/null
          done
          # Two scrape intervals, so rate() and sum_over_time() have a window.
          sleep 12
          .github/scripts/check-dashboards.sh http://127.0.0.1:9090 lab

      - name: Logs on failure
        if: failure()
        run: |
          cat cupel.log || true
          docker logs cupel-geth 2>&1 | tail -50 || true
          curl -s http://127.0.0.1:9090/api/v1/targets | head -c 2000 || true

      - name: Tear down
        if: always()
        run: |
          ./target/debug/cupel observe --down || true
          ./target/debug/cupel down || true
  network:
    name: network
    # Nine containers, four images to pull and several minutes to the first
    # finalised epoch. Too heavy for every pull request, and the only way to
    # know that three consensus clients still agree after a dependency moves.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: cargo build -p cupel

      - name: Pull the client images first
        # Genesis is stamped the moment `network up` generates it, and the
        # beacon chain starts thirty seconds later whether or not the clients
        # are running. Pulling four images afterwards would burn the first
        # epochs with a third of the validators offline, and epochs with less
        # than two thirds voting do not justify — so the chain would take twice
        # as long to finalise, or not finalise inside the timeout at all.
        run: |
          for image in ethpandaops/ethereum-genesis-generator:6.2.1 \
                       ethereum/client-go:stable \
                       ethereum/client-go:alltools-stable \
                       sigp/lighthouse:latest \
                       gcr.io/offchainlabs/prysm/beacon-chain:latest \
                       gcr.io/offchainlabs/prysm/validator:latest \
                       consensys/teku:latest \
                       alpine; do
            docker pull -q "$image"
          done

      - name: Bring up the devnet
        run: ./target/debug/cupel network up --detach

      - name: The chain finalises
        # Finality is the whole claim of this mode. Two thirds of the stake must
        # agree, and the stake is split so that no single node holds it.
        #
        # Thirty minutes, not twenty, and the difference is not slack. An
        # epoch is 32 six-second slots, so a chain keeping time finalises inside
        # ten minutes. A GitHub runner does not keep time: nine containers —
        # three geth, three beacon nodes, two validators — on two cores miss
        # roughly every other slot, and a run that reached slot 98 in twenty
        # minutes was producing a block every twelve seconds rather than every
        # six. That halves the epoch rate, so finality lands just outside the old
        # window, and the step reported "no finalised epoch after twenty minutes"
        # — true, and silent about why.
        #
        # So the wait is long enough for a chain running at half speed, and what
        # it prints says whether that is what is happening: the head slot beside
        # the slot the wall clock expects. Behind means the runner is starved,
        # not that consensus is broken.
        run: |
          genesis=$(curl -sf http://127.0.0.1:5052/eth/v1/beacon/genesis \
            | jq -r '.data.genesis_time // 0' 2>/dev/null || echo 0)
          case "$genesis" in ''|*[!0-9]*) genesis=0 ;; esac

          for _ in $(seq 1 150); do
            # A failed request yields an empty string, and an empty string is
            # not "0" — testing for inequality would report a chain that never
            # answered as a chain that finalised. Insist on a positive integer.
            checkpoints=$(curl -sf http://127.0.0.1:5052/eth/v1/beacon/states/head/finality_checkpoints || echo '{}')
            epoch=$(printf '%s' "$checkpoints" | jq -r '.data.finalized.epoch // 0' 2>/dev/null || echo 0)
            just=$(printf '%s' "$checkpoints" | jq -r '.data.current_justified.epoch // 0' 2>/dev/null || echo 0)
            case "$epoch" in ''|*[!0-9]*) epoch=0 ;; esac
            case "$just" in ''|*[!0-9]*) just=0 ;; esac

            slot=$(curl -sf http://127.0.0.1:5052/eth/v1/beacon/headers/head \
              | jq -r '.data.header.message.slot // 0' 2>/dev/null || echo 0)
            case "$slot" in ''|*[!0-9]*) slot=0 ;; esac

            if [ "$genesis" -gt 0 ]; then
              want=$(( ( $(date +%s) - genesis ) / 6 ))
              echo "slot $slot of an expected $want   justified $just   finalized $epoch"
            else
              echo "slot $slot   justified $just   finalized $epoch"
            fi

            if [ "$epoch" -gt 0 ]; then exit 0; fi
            sleep 10
          done

          echo
          echo "no finalised epoch after thirty minutes"
          if [ "$genesis" -gt 0 ]; then
            want=$(( ( $(date +%s) - genesis ) / 6 ))
            echo "the chain reached slot $slot where the clock expected $want."
            echo "well short of that is a starved runner missing slots, not a"
            echo "consensus failure — the same chain finalises on a laptop."
          fi
          exit 1

      - name: All three clients agree
        # Three independent implementations, one chain. A disagreement here is
        # the most interesting failure this repository can produce.
        run: |
          set -e
          for port in 5052 5152 5252; do
            curl -sf "http://127.0.0.1:$port/eth/v1/beacon/headers/finalized" \
              | jq -r '.data.root' >> roots.txt
          done
          cat roots.txt
          test "$(sort -u roots.txt | wc -l)" -eq 1

      - name: The devnet carries the same contracts as the lab
        run: |
          set -e
          for port in 8555 8556 8557; do
            RPC="http://127.0.0.1:$port"
            test "$(cast chain-id --rpc-url $RPC)" = "31337"
            test "$(cast call 0x00000000000000000000000000000000c0de0020 'name()(string)' --rpc-url $RPC)" \
              = '"Cupel Token"'
          done

      - name: A transaction reaches a beacon-chain proposer
        run: |
          set -e
          RPC=http://127.0.0.1:8555
          KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
          ME=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
          cast send 0x00000000000000000000000000000000c0de0020 'mint(address,uint256)' $ME 1000000000000000000000 \
            --rpc-url $RPC --private-key $KEY --timeout 120 >/dev/null
          test "$(cast call 0x00000000000000000000000000000000c0de0020 'balanceOf(address)(uint256)' $ME --rpc-url $RPC)" \
            = "1000000000000000000000 [1e21]"

      - name: Every dashboard panel resolves
        # Same check as the lab job, against the mode that has consensus clients:
        # between the two, every panel on every dashboard is proven to resolve in
        # at least one mode, and the skip-lists say which mode that is.
        run: |
          ./target/debug/cupel observe
          for _ in $(seq 1 60); do
            cl=$(curl -sfG http://127.0.0.1:9090/api/v1/query \
                  --data-urlencode 'query=up{job="cupel-consensus"}==1' | jq -r '.data.result|length')
            el=$(curl -sfG http://127.0.0.1:9090/api/v1/query \
                  --data-urlencode 'query=up{job="cupel-execution"}==1' | jq -r '.data.result|length')
            echo "targets up — consensus:${cl:-0} execution:${el:-0}"
            [ "${cl:-0}" -ge 3 ] && [ "${el:-0}" -ge 3 ] && break
            sleep 2
          done
          sleep 12
          .github/scripts/check-dashboards.sh http://127.0.0.1:9090 network

      - name: Logs on failure
        if: failure()
        run: |
          for c in el1 cl1 vc1 el2 cl2 vc2 el3 cl3 bootnode; do
            echo "===== cupel-$c ====="
            docker logs "cupel-$c" 2>&1 | tail -40 || true
          done
          curl -s http://127.0.0.1:9090/api/v1/targets | head -c 2000 || true

      - name: Tear down
        if: always()
        run: |
          ./target/debug/cupel observe --down || true
          ./target/debug/cupel network reset || true
