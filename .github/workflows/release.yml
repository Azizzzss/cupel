# Build `cupel` for the three desktop platforms on every version tag and attach
# the binaries to the release.
#
# The point is that trying Cupel should not require a Rust toolchain. Docker is
# needed either way — the chain runs in containers — but the control plane is a
# single binary, and asking somebody to install Rust before they can look at a
# block is a tax with nothing behind it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # The publish job asks what CI made of this commit before publishing it.
  actions: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing to build should not hide whether the others did.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p cupel --target ${{ matrix.target }}

      - name: It is the version the tag names
        # This step used to print `--version` and compare it with nothing, under
        # a title that said otherwise. A tag moved onto a commit whose
        # Cargo.toml still held the old number would have published a binary
        # that disagreed with the release it was attached to, and the first
        # person to notice would have been somebody reading `cupel --version`.
        shell: bash
        run: |
          set -eu
          BIN="target/${{ matrix.target }}/release/cupel"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          said=$("$BIN" --version | awk '{ print $2 }')
          echo "the binary says $said"
          case "${{ github.ref_name }}" in
            v*)
              want="${{ github.ref_name }}"
              want="${want#v}"
              if [ "$said" != "$want" ]; then
                echo "but the tag says $want."
                echo "Bump the workspace version and commit it, or move the tag."
                exit 1
              fi
              echo "which is what ${{ github.ref_name }} says"
              ;;
            *)
              echo "not a tag, so there is nothing to compare it with"
              ;;
          esac

      - name: Package
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          NAME="cupel-${{ github.ref_name }}-${{ matrix.name }}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/$NAME.zip" \
              "./target/${{ matrix.target }}/release/cupel.exe" \
              ./README.md ./LICENSE-MIT ./LICENSE-APACHE
          else
            tar -czf "dist/$NAME.tar.gz" \
              -C "target/${{ matrix.target }}/release" cupel \
              -C "$GITHUB_WORKSPACE" README.md LICENSE-MIT LICENSE-APACHE
          fi
          ls -la dist/

      - name: The packaged binary works where a download lands
        # The check that would have caught what this release now fixes. The old
        # smoke test ran the binary from inside the checkout, where
        # `compose/lab.yml` is always a directory or two up — so it passed
        # while every download failed with "could not find a Cupel checkout".
        # This one unpacks the archive somewhere with no checkout above it,
        # which is where the person who downloaded it is standing.
        shell: bash
        run: |
          set -eu
          out="$RUNNER_TEMP/unpacked"
          home="$RUNNER_TEMP/home"
          rm -rf "$out" "$home"
          mkdir -p "$out"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z x "$GITHUB_WORKSPACE/dist/$NAME.zip" -o"$out" > /dev/null
            BIN="$out/cupel.exe"
          else
            tar -xzf "$GITHUB_WORKSPACE/dist/$NAME.tar.gz" -C "$out"
            BIN="$out/cupel"
          fi

          cd "$RUNNER_TEMP"
          CUPEL_HOME="$home" "$BIN" contracts
          CUPEL_HOME="$home" "$BIN" lab

          for needed in compose/lab.yml compose/network.yml compose/observe.yml \
                        config/genesis/genesis.json config/prometheus/prometheus.yml; do
            if [ ! -f "$home/$needed" ]; then
              echo "$needed was not laid out, so a chain cannot start from here"
              exit 1
            fi
          done
          # Generated per chain. One carried in a release would be the same
          # Engine API secret on every machine that downloaded it.
          if [ -f "$home/config/genesis/jwt.hex" ]; then
            echo "the archive carries an Engine API secret"
            exit 1
          fi
          echo "the download carries what it needs and nothing it should not"

      # Only a hand-off to the publish job, which attaches the archives to the
      # release — so a day, not the default ninety. Artifact storage is one
      # quota across the whole account, and v0.8.0's first run was refused by
      # it at this step with every build already passing.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Only a real tag publishes. workflow_dispatch exists to check that the four
    # builds still work without making a release out of it.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: CI agrees with the commit this tag names
        # v0.7.0 published while CI on its own commit was red. The builds above
        # prove the binary compiles and runs; they say nothing about the devnet
        # reaching finality, the committed bundle matching its source, or the
        # contracts still passing — which is what CI is for, and a release is
        # the wrong place to find out.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha="${{ github.sha }}"
          echo "waiting for CI on $sha"
          for _ in $(seq 1 90); do
            run=$(gh run list --workflow CI --commit "$sha" --limit 1 \
              --json status,conclusion,url \
              --jq '.[] | "\(.status) \(.conclusion) \(.url)"' || true)
            case "$run" in
              completed*)
                verdict=$(echo "$run" | cut -d' ' -f2)
                where=$(echo "$run" | cut -d' ' -f3)
                echo "CI $verdict: $where"
                if [ "$verdict" = "success" ]; then
                  exit 0
                fi
                echo "Publishing a commit CI rejected is how a broken release goes out."
                echo "Fix it on main, then move the tag."
                exit 1
                ;;
              "")
                echo "no CI run for this commit yet"
                ;;
              *)
                echo "CI is ${run%% *}"
                ;;
            esac
            sleep 60
          done
          echo "CI did not finish within ninety minutes, so nothing was published"
          exit 1

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from the changelog
        # The changelog is written per release anyway, and retyping it into a
        # release body is how the two start disagreeing.
        run: |
          python3 - "${{ github.ref_name }}" > notes.md <<'PY'
          import re, sys
          tag = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## |\Z)",
              text, re.S | re.M,
          )
          print(match.group(1).strip() if match else f"See CHANGELOG.md for {tag}.")
          PY
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
          draft: false
