[package]
name = "cupel"
description = "Control plane for the Cupel local Ethereum lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "cupel"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
cupel-gateway = { path = "../gateway" }
cupel-producer = { path = "../producer" }
cupel-signer = { path = "../signer" }
alloy = { version = "2.1.1", features = ["signer-local", "consensus", "eips"] }
anyhow.workspace = true
axum.workspace = true
clap = { version = "4", features = ["derive"] }
hex.workspace = true
mime_guess = "2"
rand.workspace = true
reqwest.workspace = true
# `include-exclude` keeps the generated Engine API secret out of the binary;
# `debug-embed` makes a debug build carry the same files a release does, so
# "it worked on my machine" cannot mean "my machine had the checkout".
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# The same as the gateway's: enough of tower to put a request through a real
# router in a test rather than calling a handler around it.
tower = { version = "0.5", features = ["util"] }
