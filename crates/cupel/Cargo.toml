[package]
name = "cupel"
description = "Control plane for the Cupel local Ethereum lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "cupel"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
cupel-gateway = { path = "../gateway" }
cupel-producer = { path = "../producer" }
cupel-signer = { path = "../signer" }
alloy = { version = "2.1.1", features = ["signer-local", "consensus", "eips"] }
anyhow.workspace = true
axum.workspace = true
clap = { version = "4", features = ["derive"] }
mime_guess = "2"
reqwest.workspace = true
rust-embed = "8"
serde_json.workspace = true
tokio.workspace = true
