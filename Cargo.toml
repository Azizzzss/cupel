[workspace]
resolver = "3"
members = ["crates/cupel", "crates/gateway", "crates/producer", "crates/signer"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["Azios <115838811+Azizzzss@users.noreply.github.com>"]
repository = "https://github.com/Azizzzss/cupel"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
hex = "0.4"
jsonwebtoken = "9"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
