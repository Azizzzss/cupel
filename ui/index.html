<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cupel — control room</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // A remembered theme, applied before the stylesheet paints anything.
      try {
        var theme = localStorage.getItem('cupel:theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme)
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
